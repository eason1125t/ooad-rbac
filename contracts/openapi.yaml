        - pmis
      summary: 验证工程项目统一权限入口，不返回业务记录
      x-application: pmis
      x-requirements:
        - FR-02
        - FR-03
        - FR-08
      x-access: permission
      x-permission: pmis:project:view
      x-csrf: false
      responses:
        '200':
          $ref: '#/components/responses/Demo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
