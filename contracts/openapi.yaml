# 功能：唯一API契约；目录与业务定义先于实现，生成前端类型、接口说明并同步私有Apifox。
openapi: 3.0.3
info:
  title: 市政统一权限 API
  version: 0.4.0
  description: RBAC0资源目录、角色与员工授权、OA公文与PMIS立项；同站点Session/CSRF，v2授权独立生效及SQL数据范围。Excel导入、组织移动完整影响分析与RBAC1–3另行实施。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: admin
  - name: oa
  - name: pmis
  - name: health
x-planned-operations:
  - requirement: FR-06
    resource: /api/v1/admin/imports
    status: DESIGNED_NOT_EXPOSED
    lifecycle: 校验预览后确认整批提交；同名负责人不自动匹配
paths:
  /api/v1/health:
    get:
      operationId: health
      tags:
        - health
      summary: 存活状态，不代表依赖就绪
      security: []
      x-application: shared
      x-requirements:
        - NFR-04
      x-access: public
      x-csrf: false
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - UP
              example:
                data:
                  status: UP
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      tags:
        - auth
      summary: 获取服务端CSRF令牌，登录和退出后重新获取
      security: []
      x-application: shared
      x-requirements:
        - FR-01
        - FR-03
      x-access: public
      x-csrf: false
      responses:
        '200':
          description: CSRF令牌；响应不可缓存
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Csrf'
              example:
                data:
                  token: opaque-example
                  headerName: X-CSRF-TOKEN
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: 环境初始化账号登录
      security: []
      x-application: shared
      x-requirements:
        - FR-01
        - FR-03
        - FR-09
      x-access: public-with-csrf
      x-csrf: true
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: oa-user-1
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 72
      responses:
        '200':
          description: 登录成功并更新Session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedResponse'
              example:
                data:
                  authenticated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: 撤销当前会话（幂等），保留CSRF校验
      x-application: shared
      x-requirements:
        - FR-01
        - FR-09
      x-access: session-logout
      x-csrf: true
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 当前会话已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedResponse'
              example:
                data:
                  authenticated: false
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
        - auth
      summary: 当前服务端主体及实时权限集合
      x-application: shared
      x-requirements:
        - FR-01
        - FR-02
        - FR-09
      x-access: authenticated
      x-csrf: false
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
              example:
                data:
                  id: '1'
                  username: oa-user-1
                  permissions:
                    - oa:document:view
                  forcePasswordChange: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/demo:
    get:
      operationId: adminDemo
      tags:
        - admin
      summary: 验证管理端统一权限入口
      x-application: admin
      x-requirements:
        - FR-02
        - FR-03
      x-access: permission
      x-permission: admin:console:view
      x-csrf: false
      responses:
        '200':
          $ref: '#/components/responses/Demo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/oa/demo:
