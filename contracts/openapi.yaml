      x-csrf: false
      responses:
        '200':
          $ref: '#/components/responses/Demo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/pmis/demo:
    get:
