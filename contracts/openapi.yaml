components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: 同一Cookie会话通过GET csrf取得的token
  schemas:
    Csrf:
      type: object
      required:
        - token
        - headerName
      properties:
        token:
          type: string
        headerName:
          type: string
          enum:
            - X-CSRF-TOKEN
    Me:
      type: object
      required:
        - id
        - username
        - permissions
        - forcePasswordChange
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        username:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        forcePasswordChange:
          type: boolean
    AuthenticatedResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - authenticated
          properties:
            authenticated:
              type: boolean
    DemoResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - application
            - status
            - message
          properties:
            application:
              type: string
              enum:
                - admin
                - oa
                - pmis
            status:
              type: string
              enum:
                - SKELETON
            message:
              type: string
    Error:
      type: object
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
      example:
        code: FORBIDDEN
        message: 无访问权限
        traceId: example-trace
    PageMetadata:
      description: 未来列表接口共享规范，本轮未暴露列表
      type: object
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        total:
          type: integer
          minimum: 0
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - nodeType
        - parentId
        - managerEmployeeId
        - enabled
        - version
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        code:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        name:
          type: string
          minLength: 1
          maxLength: 160
        nodeType:
          type: string
          enum:
            - HEADQUARTERS
            - BRANCH
            - DEPARTMENT
        parentId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        managerEmployeeId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    OrganizationCreate:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - nodeType
        - parentId
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        name:
          type: string
          minLength: 1
          maxLength: 160
        nodeType:
          type: string
          enum:
            - HEADQUARTERS
            - BRANCH
            - DEPARTMENT
        parentId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
    OrganizationUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - managerEmployeeId
        - expectedVersion
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        managerEmployeeId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    StatusChange:
      type: object
      additionalProperties: false
      required:
        - enabled
        - expectedVersion
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    MovePreviewRequest:
      type: object
      additionalProperties: false
      required:
        - parentId
        - expectedVersion
      properties:
        parentId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    MovePreview:
      type: object
      additionalProperties: false
      required:
        - token
        - organizationId
        - parentId
        - expectedVersion
        - treeVersion
        - affectedEmployees
        - expiresAt
      properties:
        token:
          type: string
          format: uuid
        organizationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        parentId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        treeVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        affectedEmployees:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
    MoveCommit:
      type: object
      additionalProperties: false
      required:
        - previewToken
      properties:
        previewToken:
          type: string
          format: uuid
    Employee:
      type: object
      additionalProperties: false
      required:
        - id
        - employeeCode
        - displayName
        - organizationId
        - positionName
        - phone
        - enabled
        - version
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        employeeCode:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        organizationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        positionName:
          type: string
          nullable: true
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 32
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    EmployeeCreate:
      type: object
      additionalProperties: false
      required:
        - employeeCode
        - displayName
        - organizationId
        - positionName
        - phone
      properties:
        employeeCode:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        organizationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        positionName:
          type: string
          nullable: true
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 32
    EmployeeUpdate:
      type: object
      additionalProperties: false
      required:
        - displayName
        - phone
        - expectedVersion
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 32
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    ManagedAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - employeeId
        - enabled
        - forcePasswordChange
        - version
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        employeeId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          nullable: true
        enabled:
          type: boolean
        forcePasswordChange:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    AccountCreate:
      type: object
      additionalProperties: false
      required:
        - username
        - employeeId
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
        employeeId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
    TemporaryCredential:
      type: object
      additionalProperties: false
      required:
        - account
        - temporaryPassword
      properties:
        account:
          $ref: '#/components/schemas/ManagedAccount'
        temporaryPassword:
          type: string
          format: password
          description: 仅此响应显示一次；不写审计或日志。demo为1234且不强制改密，正常环境随机强口令并强制改密。
    PasswordReset:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    PasswordChange:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 72
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: 至少12字符，最多72个UTF-8字节，且不能与旧密码相同；旧密码不受新策略拒绝。
    AuditRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - actorUserId
        - action
        - targetType
        - targetId
        - beforeState
        - afterState
        - traceId
        - createdAt
